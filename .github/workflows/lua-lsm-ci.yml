# Self-hosted CI for the Lua-LSM matrices. The runner must have a KVM-capable
# host and carry the lua-lsm-kvm label; the hk ECS has no nested virtualization
# and keeps only lua-lsm-hk, so it is not selected.
name: Lua-LSM CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      concurrency:
        description: Run the concurrency matrix (fails until the unregister races are fixed)
        type: boolean
        default: false

env:
  WS: ${{ github.workspace }}/ws

jobs:
  build:
    name: build kernel + rootfs
    runs-on: [self-hosted, Linux, X64, lua-lsm-kvm]
    timeout-minutes: 90
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: ws/kernel/linux
          fetch-depth: 1

      - name: Build kernel
        run: |
          cd "$WS/kernel/linux"
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config .github/ci/kernel.config
          make olddefconfig
          grep -E "CONFIG_SECURITY_LUA_LSM=|CONFIG_SECURITY_LUA_LSM_STATS=|CONFIG_MODULES=|CONFIG_9P_FS=" .config
          make -j"$(nproc)" bzImage

      - name: Build rootfs
        run: |
          ssh-keygen -t rsa -b 2048 -f "$WS/ci_key" -N "" -q
          # Root helper is a root-owned copy of the harness script; the runner
          # only gets sudo for this one command.
          sudo /usr/local/sbin/lua-lsm-create-rootfs \
            "$WS/ci_key.pub" "$WS/rootfs.img" 4G
          # Mostly holes; qcow2 -c keeps the artifact small and the harness
          # picks the disk format from the suffix.
          qemu-img convert -f raw -O qcow2 -c "$WS/rootfs.img" "$WS/rootfs.qcow2"
          rm -f "$WS/rootfs.img"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: lua-lsm-kernel
          path: ws/kernel/linux/arch/x86/boot/bzImage
          if-no-files-found: error

      - name: Upload rootfs and key
        uses: actions/upload-artifact@v4
        with:
          name: lua-lsm-rootfs
          path: |
            ws/rootfs.qcow2
            ws/ci_key
            ws/ci_key.pub
          if-no-files-found: error

  build-concurrency:
    name: build KCSAN + lockdep kernel
    # Opt-in until the unregister races are fixed: ~12 min build for an
    # expected kernel-bug verdict.
    if: inputs.concurrency || contains(github.event.pull_request.labels.*.name, 'concurrency')
    runs-on: [self-hosted, Linux, X64, lua-lsm-kvm]
    timeout-minutes: 120
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: ws/kernel/linux
          fetch-depth: 1

      - name: Build kernel
        run: |
          cd "$WS/kernel/linux"
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config \
            .github/ci/kernel.config .github/ci/kernel.config.concurrency
          make olddefconfig
          grep -E "CONFIG_KCSAN=|CONFIG_KCSAN_STRICT=|CONFIG_PROVE_LOCKING=|CONFIG_PREEMPT=" .config
          make -j"$(nproc)" bzImage

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: lua-lsm-kernel-concurrency
          path: ws/kernel/linux/arch/x86/boot/bzImage
          if-no-files-found: error

  functional:
    name: functional matrix
    needs: build
    uses: ./.github/workflows/matrix.yml
    with:
      matrix: functional
      config: configs/functional.yaml
      kernel-artifact: lua-lsm-kernel
      timeout: 180

  policies:
    name: custom policy matrix
    needs: build
    uses: ./.github/workflows/matrix.yml
    with:
      matrix: policies
      config: configs/policies.yaml
      kernel-artifact: lua-lsm-kernel
      kernel-tree: true
      timeout: 180

  concurrency:
    name: concurrency correctness
    needs: [build, build-concurrency]
    if: inputs.concurrency || contains(github.event.pull_request.labels.*.name, 'concurrency')
    uses: ./.github/workflows/matrix.yml
    with:
      matrix: concurrency
      config: .github/ci/concurrency.yaml
      config-in-kernel: true
      kernel-artifact: lua-lsm-kernel-concurrency
      kernel-tree: true
      mem: 6G
      smp: "4"
      timeout: 240
