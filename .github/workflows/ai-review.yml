# Automated code review for pull requests, on the hk self-hosted runner.
#
# The reviewer is the linux-code-review skill installed out of tree at
# /opt/lua-lsm-review/linux-code-review; its model credential is read from
# /etc/lua-lsm-review/bailian.env. Neither the skill nor the credential is
# checked into this repository.
#
# Trust model: only commits authored by the repository owner are reviewed
# (checked against the GitHub commit list after checkout). The agent itself
# runs inside a bubblewrap sandbox with no network route except loopback,
# where tools/ai-review/relay.py forwards to a host-side unix-socket proxy
# that holds the real key (tools/ai-review/proxy.py). The sandbox sees a
# dummy key, the PR checkout, and the skill -- nothing else.
#
# Triggered by PR pushes, by a maintainer comment containing "/ai-review"
# on an open PR, or manually. issue_comment workflows are always taken from
# the default branch, so changes here only take effect after they land there.
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    ai-review-${{ github.event.pull_request.number ||
    github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.issue.state == 'open' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.comment.body, '/ai-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: [self-hosted, Linux, X64, lua-lsm-hk]
    timeout-minutes: 90
    env:
      SKILL: /opt/lua-lsm-review/linux-code-review
      PR_NUMBER: >-
        ${{ github.event.pull_request.number || github.event.issue.number ||
        inputs.pr_number }}
    steps:
      - name: Verify the commits are owner-authored
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          authors=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[].author.login // "unlinked"')
          echo "$authors" | sort | uniq -c
          if echo "$authors" | grep -qvx "$OWNER"; then
            echo "::error::refusing to review: commits not authored by $OWNER"
            exit 1
          fi

      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number ||
            github.event.issue.number || inputs.pr_number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR coordinates
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          # The skill reviews merge-base(base)..HEAD. Ask GitHub for the
          # current merge-base, then fetch only the PR's commit series
          # instead of the kernel's full history.
          n=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .commits)
          case "$n" in
            ''|*[!0-9]*) echo "unexpected commit count: $n" >&2; exit 1 ;;
          esac
          base_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq .base.sha)
          base=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/${base_sha}...${head}" \
            --jq '.merge_base_commit.sha // empty')
          test -n "$base" || {
            echo "could not resolve the PR merge-base" >&2
            exit 1
          }
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          depth=$((n + 2))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth="$depth" origin "refs/pull/$PR_NUMBER/head"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              fetch --no-tags --deepen="$depth" origin "refs/pull/$PR_NUMBER/head"
          fi
          git cat-file -e "${base}^{commit}"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Fetch the reviewer harness
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/ai-review-harness"
          rm -rf "$dest"
          mkdir -p "$dest/profile"
          for f in proxy.py relay.py sandbox.sh \
                   profile/profile.json profile/config.toml; do
            gh api -X GET \
              "repos/$GITHUB_REPOSITORY/contents/tools/ai-review/$f" \
              -f ref="$REF" --jq .content | base64 -d > "$dest/$f"
          done

      - name: Run linux-code-review (sandboxed)
        env:
          TMPDIR: ${{ runner.temp }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          set -a; . /etc/lua-lsm-review/bailian.env; set +a
          test -n "${DASHSCOPE_API_KEY:-}" || {
            echo "DASHSCOPE_API_KEY is not configured on this runner" >&2
            exit 1
          }
          test -x "$SKILL/linux_code_review.sh" || {
            echo "linux-code-review is not installed at $SKILL" >&2
            exit 1
          }
          harness="$RUNNER_TEMP/ai-review-harness"
          out="$RUNNER_TEMP/ai-review-out"
          rm -rf "$out"; mkdir -p "$out"
          sock="$RUNNER_TEMP/proxy-$GITHUB_RUN_ID.sock"
          python3 "$harness/proxy.py" "$sock" &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true; rm -f "$sock"' EXIT
          for _ in $(seq 1 100); do
            [ -S "$sock" ] && break
            sleep 0.1
          done
          [ -S "$sock" ] || { echo "the proxy did not start" >&2; exit 1; }
          bash "$harness/sandbox.sh" \
            "$GITHUB_WORKSPACE" "$SKILL" "$sock" "$BASE" "$out" \
            2>&1 | tee "$RUNNER_TEMP/review.log"

      - name: Post the review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/ai-review-out/review.md"
          test -s "$review" || {
            echo "the review produced no output" >&2
            exit 1
          }
          "$SKILL/scripts/post_reviews_to_github.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --finalize --event comment "$review"

      - name: Upload the review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.number ||
            github.event.issue.number || inputs.pr_number }}
          path: ${{ runner.temp }}/ai-review-out/review.md
          if-no-files-found: ignore
