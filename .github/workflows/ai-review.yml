# Automated code review for pull requests, on the hk self-hosted runner.
#
# The reviewer is the linux-code-review skill installed out of tree at
# /opt/lua-lsm-review/linux-code-review; its model credential is read from
# /etc/lua-lsm-review/bailian.env. Neither the skill nor the credential is
# checked into this repository.
#
# Auto-runs only for same-repository PRs. A fork PR would hand untrusted code
# to an agent that holds a model credential, so the job refuses fork PRs for
# both triggers. Containerize the reviewer or hold the key behind a network
# proxy before relaxing that.
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, lua-lsm-hk]
    timeout-minutes: 90
    env:
      SKILL: /opt/lua-lsm-review/linux-code-review
      LCR_AGENT_PROFILE: codex_bailian
    steps:
      - name: Refuse fork PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          head_repo=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq .head.repo.full_name)
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$PR_NUMBER comes from $head_repo;" \
              "the credential-bearing reviewer only runs on same-repository PRs" >&2
            exit 1
          fi

      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              format('refs/pull/{0}/head', inputs.pr_number) ||
              github.event.pull_request.head.sha
            }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR coordinates
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          # The skill reviews merge-base(base)..HEAD. Ask GitHub for the
          # current merge-base, then fetch only the PR's commit series
          # instead of the kernel's full history.
          n=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .commits)
          case "$n" in
            ''|*[!0-9]*) echo "unexpected commit count: $n" >&2; exit 1 ;;
          esac
          base_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq .base.sha)
          base=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/${base_sha}...${head}" \
            --jq '.merge_base_commit.sha // empty')
          test -n "$base" || {
            echo "could not resolve the PR merge-base" >&2
            exit 1
          }
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          depth=$((n + 2))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth="$depth" origin "refs/pull/$PR_NUMBER/head"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              fetch --no-tags --deepen="$depth" origin "refs/pull/$PR_NUMBER/head"
          fi
          git cat-file -e "${base}^{commit}"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Run linux-code-review
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [ -r /etc/lua-lsm-review/bailian.env ]; then
            . /etc/lua-lsm-review/bailian.env
          fi
          test -n "${DASHSCOPE_API_KEY:-}" || {
            echo "DASHSCOPE_API_KEY is not configured on this runner" >&2
            exit 1
          }
          test -x "$SKILL/linux_code_review.sh" || {
            echo "linux-code-review is not installed at $SKILL" >&2
            exit 1
          }
          mkdir -p "$TMPDIR"
          "$SKILL/linux_code_review.sh" \
            diff "${{ steps.pr.outputs.base }}" \
            "$GITHUB_WORKSPACE/review.md" \
            --per-persona-context=no 2>&1 | tee "$RUNNER_TEMP/review.log"

      - name: Post the review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/review.md" || {
            echo "the review produced no output" >&2
            exit 1
          }
          "$SKILL/scripts/post_reviews_to_github.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --finalize --event comment "$GITHUB_WORKSPACE/review.md"

      - name: Upload the review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ steps.pr.outputs.number || github.run_id }}
          path: |
            review.md
            ${{ runner.temp }}/review.log
          if-no-files-found: ignore
