name: reviewer-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, lua-lsm-hk]
    timeout-minutes: 10
    steps:
      - name: Report the runner environment
        run: |
          set -x
          id
          which bwrap socat || true
          bwrap --version || echo NO_BWRAP
          for p in /bin /sbin /lib /lib64 /usr/local/bin/codex /usr/bin/node; do
            printf '%s -> ' "$p"; readlink -f "$p" || true
          done
          head -c 80 /usr/local/bin/codex; echo
          ls -ld /usr/local/lib/node_modules /usr/lib/node_modules 2>/dev/null || true
          ls -d /etc/pki /etc/ssl 2>/dev/null || true
          python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"
          bwrap --unshare-all --die-with-parent --new-session \
            --ro-bind /usr /usr --ro-bind /etc/passwd /etc/passwd \
            --ro-bind /etc/group /etc/group --dev /dev --proc /proc \
            /usr/bin/true && echo BWRAP_OK || echo BWRAP_FAIL
          bwrap --unshare-all --die-with-parent --new-session \
            --ro-bind /usr /usr --ro-bind /etc/passwd /etc/passwd \
            --ro-bind /etc/group /etc/group --dev /dev --proc /proc \
            /usr/bin/python3 -c 'import socket
s = socket.socket(); s.settimeout(2)
print("net_rc", s.connect_ex(("1.1.1.1", 443)))' || echo NET_TEST_FAIL
          python3 - <<'PY'
import socket, threading
p = "/tmp/probe.sock"
try:
    srv = socket.socket(socket.AF_UNIX); srv.bind(p); srv.listen(1)
    print("unix_socket_ok")
except OSError as e:
    print("unix_socket_fail", e)
PY
